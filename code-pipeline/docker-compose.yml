services:
  postgres:
    image: postgres:16-alpine
    container_name: code-pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: code-pipeline-airflow
    restart: unless-stopped
    env_file:
      - .env
      - airflow/config/airflow.env
    environment:
      PYTHONPATH: /opt/airflow
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./worker:/opt/airflow/worker
      - ./infra:/opt/airflow/infra
      - airflow_logs:/opt/airflow/logs
      - ./local_data:/opt/airflow/local_data
      - ./benchmark_data:/opt/airflow/benchmark_data
    command: >
      bash -c "
      echo 'Waiting for Postgres (5432)...' &&
      until (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; do
        echo 'Postgres is not ready yet... sleeping'
        sleep 2
      done &&
      echo 'Waiting for Tor-Proxy (9050)...' &&
      until (echo > /dev/tcp/tor-proxy/9050) >/dev/null 2>&1; do
        echo 'Tor is not ready yet... sleeping'
        sleep 3
      done &&
      echo 'Postgres + Tor-Proxy are UP! Starting Airflow...' &&
      python /opt/airflow/config/prune_airflow_logs.py &
      airflow db init &&
      airflow db migrate &&
      (
        airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin ||
        airflow users reset-password --username admin --password admin
      ) &&
      airflow pools set \"$${AIRFLOW_GITHUB_SEARCH_POOL:-github_search_pool}\" \"$${AIRFLOW_GITHUB_SEARCH_POOL_SLOTS:-1}\" 'Gate GitHub search endpoints' &&
      airflow scheduler & exec airflow webserver
      "
    depends_on:
      postgres:
        condition: service_healthy
      tor-proxy:
        condition: service_started
  tor-proxy:
    image: dockurr/tor
    container_name: tor-proxy
    environment:
      - TOR_CONTROL_PORT=9051
    ports:
      - "9050:9050"
      - "9051:9051"
    restart: always
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    container_name: os-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://100.97.222.61:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      SERVER_HOST: "0.0.0.0"
    ports:
      - "5601:5601"

volumes:
  airflow_logs:
  postgres_data:
