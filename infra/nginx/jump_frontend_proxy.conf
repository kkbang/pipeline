# Example nginx config for the jump server.
# Expected topology:
# - frontend dev/build server on the jump host: 127.0.0.1:5173
# - retrieval API on the backend host:        ngseo-ubuntu:18000
#
# Copy this file onto the jump server and enable it from your nginx site config.
# If the backend API remains directly reachable from the internet, clients can still
# bypass this front proxy. Prefer allowing 18000 only from the jump server.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=retrieval_api_per_ip:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=retrieval_api_conn_per_ip:10m;

upstream jump_frontend_dev {
    server 127.0.0.1:5173;
    keepalive 16;
}

upstream retrieval_api_backend {
    server ngseo-ubuntu:18000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64k;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        limit_req zone=retrieval_api_per_ip burst=3 nodelay;
        limit_req_status 429;
        limit_conn retrieval_api_conn_per_ip 2;

        proxy_http_version 1.1;
        proxy_pass http://retrieval_api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 900s;
    }

    location / {
        proxy_http_version 1.1;
        proxy_pass http://jump_frontend_dev;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
