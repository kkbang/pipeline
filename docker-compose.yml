services:
  postgres:
    image: postgres:16-alpine
    container_name: code-pipeline-postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    mem_reservation: ${POSTGRES_MEM_RESERVATION:-256m}
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: code-pipeline-airflow
    restart: unless-stopped
    mem_limit: ${AIRFLOW_MEM_LIMIT:-20g}
    mem_reservation: ${AIRFLOW_MEM_RESERVATION:-8g}
    cpus: ${AIRFLOW_CPUS:-12}
    env_file:
      - .env
      - airflow/config/airflow.env
    environment:
      PYTHONPATH: /opt/airflow
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./worker:/opt/airflow/worker
      - ./scripts:/opt/airflow/scripts
      - ./infra:/opt/airflow/infra
      - airflow_logs:/opt/airflow/logs
      - ./local_data:/opt/airflow/local_data
      - ./benchmark_data:/opt/airflow/benchmark_data
    command: >
      bash -c "
      echo 'Waiting for Tor-Proxy (9050)...' &&
      until (echo > /dev/tcp/tor-proxy/9050) >/dev/null 2>&1; do
        echo 'Tor is not ready yet... sleeping'
        sleep 3
      done &&
      echo 'Tor-Proxy is UP! Starting Airflow...' &&
      python /opt/airflow/config/prune_airflow_logs.py &
      airflow pools set \"$${AIRFLOW_GITHUB_SEARCH_POOL:-github_search_pool}\" \"$${AIRFLOW_GITHUB_SEARCH_POOL_SLOTS:-1}\" 'Gate GitHub search endpoints' &&
      airflow scheduler & exec airflow webserver
      "
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      tor-proxy:
        condition: service_started
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: code-pipeline-airflow-init
    restart: "no"
    mem_limit: ${AIRFLOW_INIT_MEM_LIMIT:-4g}
    mem_reservation: ${AIRFLOW_INIT_MEM_RESERVATION:-1g}
    cpus: ${AIRFLOW_INIT_CPUS:-4}
    env_file:
      - .env
      - airflow/config/airflow.env
    environment:
      PYTHONPATH: /opt/airflow
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: admin
      _AIRFLOW_WWW_USER_LASTNAME: admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./worker:/opt/airflow/worker
      - ./scripts:/opt/airflow/scripts
      - ./infra:/opt/airflow/infra
      - airflow_logs:/opt/airflow/logs
      - ./local_data:/opt/airflow/local_data
      - ./benchmark_data:/opt/airflow/benchmark_data
    command: version
    depends_on:
      postgres:
        condition: service_healthy
  tor-proxy:
    image: dockurr/tor
    container_name: tor-proxy
    mem_limit: ${TOR_PROXY_MEM_LIMIT:-512m}
    mem_reservation: ${TOR_PROXY_MEM_RESERVATION:-128m}
    environment:
      - TOR_CONTROL_PORT=9051
    ports:
      - "9050:9050"
      - "9051:9051"
    restart: always
  opensearch:
    image: opensearchproject/opensearch:3.5.0
    container_name: opensearch
    restart: unless-stopped
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-4g}
    mem_reservation: ${OPENSEARCH_MEM_RESERVATION:-2g}
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    container_name: os-dashboards
    restart: unless-stopped
    mem_limit: ${OS_DASHBOARDS_MEM_LIMIT:-1g}
    mem_reservation: ${OS_DASHBOARDS_MEM_RESERVATION:-256m}
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      SERVER_HOST: "0.0.0.0"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

volumes:
  airflow_logs:
  postgres_data:
  opensearch_data:
